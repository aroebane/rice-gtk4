# rice-gtk4 sample palette (the base layer for [Colors] in gtk4.conf).
# Thirteen role names under [Palette]; [Theme] Mode= picks light or dark.
# [Colors] in gtk4.conf overrides the derived roles key by key.

[Palette]
background=#1e1e2e
surface=#181825
surfaceVariant=#45475a
elevated=#313244
text=#cdd6f4
textMuted=#a6adc8
accent=#b4befe
positive=#a6e3a1
warning=#f9e2af
negative=#f38ba8
outline=#6c7086
focus=#b4befe
scrim=#000000

[Theme]
Mode=dark
