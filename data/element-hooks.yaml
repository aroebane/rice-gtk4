# The element ids and the CSS node hooks of the GTK 4 widgets. elements.py turns this into a C table;
# [Element.<id>] overrides are checked against the ids.
- id: widget
  hooks: ["widget"]
- id: window
  hooks: ["window", "window:backdrop", "window.dialog", "window.devel"]
- id: window-titlebar
  hooks: [".titlebar:not(headerbar)"]
- id: windowhandle
  hooks: ["windowhandle"]
- id: windowbuttonsquartz
  hooks: ["windowbuttonsquartz"]
- id: windowcontrols
  hooks: ["windowcontrols", "windowcontrols > button.minimize", "windowcontrols > button.maximize", "windowcontrols > button.close"]
- id: headerbar
  hooks: ["headerbar", "headerbar:backdrop", "headerbar.default-decoration"]
- id: headerbar-title
  hooks: ["headerbar .title", "headerbar label.title"]
- id: assistant-window
  hooks: ["window.assistant"]
- id: aboutdialog
  hooks: ["window.aboutdialog", "window.aboutdialog image.large-icons"]
- id: aboutdialog-link
  hooks: ["link"]
- id: messagedialog
  hooks: ["window.message", "window.dialog.message"]
- id: print-dialog
  hooks: ["window.dialog.print"]
- id: shortcuts-window
  hooks: ["shortcut", "shortcut > .keycap", "shortcuts-section", ".shortcuts-search-results"]
- id: shortcuts-section
