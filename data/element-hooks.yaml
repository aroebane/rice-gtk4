- id: popover
  hooks: ["popover", "popover.background", "popover.menu", "popover.entry-completion"]
- id: popover-arrow
  hooks: ["popover > arrow"]
- id: popover-contents
  hooks: ["popover > contents", "popover.emoji-picker > contents"]
- id: popovermenu
  hooks: ["popover.menu"]
- id: popoverbin
  hooks: ["popoverbin"]
- id: modelbutton
  hooks: ["modelbutton", "modelbutton.flat", "modelbutton.title", "modelbutton.model"]
