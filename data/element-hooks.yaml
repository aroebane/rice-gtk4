  hooks: ["colorbutton", "colorbutton > button"]
- id: fontbutton
  hooks: ["fontbutton", "fontbutton > button"]
- id: scalebutton
  hooks: ["scalebutton", "scalebutton.scale"]
- id: menubutton
  hooks: ["menubutton", "menubutton arrow", "menubutton arrow.down", "menubutton arrow.up"]
