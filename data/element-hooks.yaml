- id: dragicon
  hooks: ["dnd"]
- id: cursor-handle
  hooks: ["cursor-handle"]
- id: magnifier
  hooks: ["magnifier"]
- id: svg
  hooks: ["svg"]
- id: graphicsoffload
  hooks: ["graphicsoffload"]
- id: scrollbar
  hooks: ["scrollbar", "scrollbar.horizontal", "scrollbar.vertical", "scrollbar > range > trough > slider"]
- id: scrollbar-trough
  hooks: ["scrollbar > range > trough"]
- id: scrollbar-slider
