# rice-gtk4 sample config. Path: ~/.config/rice/gtk4.conf (or $RICE_GTK4_CONFIG).
# Syntax: [Section], Key=Value, '#' or ';' comment lines. Every value has a built-in default.

[Source]
# Palette file, the base layer for [Colors]. Default: gtk4-palette.ini beside this file.
# Path=gtk4-palette.ini

[Shape]
Radius=0
BorderWidth=1
FocusWidth=2
FocusOffset=1
Spacing=8
Padding=8
ControlHeight=28
ScrollBarWidth=12
IndicatorSize=16

# [Fonts]
# General=Noto Sans 10

# [Icons]
# Theme=

# --- Behaviour of states (every key optional; defaults shown) -------------------------------
# [State]
# HoverLayer=0.08          ; text colour washed over a fill on hover, 0..0.5
# PressedLayer=0.14
# DisabledContent=0.38     ; disabled text: this much text colour over the window
# DisabledContainer=0.12   ; disabled fill: this much text colour over the window
# StatusTint=0.16          ; infobar fill: this much of the status colour over the base, 0..1
# PointerHover=true        ; false: a hovered control looks like a resting one (keyboard-first)
# (the palette file may carry [State], [Contrast] and [Motion] too: this file wins key by key)
#
# [Contrast]
# Text=4.5                 ; floor for muted text
# Boundary=3.0             ; floor for border, focus, accent, primary
# Enforce=true             ; false: report only (rice-gtk4-css prints each correction)
#
# [Focus]
# Mode=inset               ; inset | outer | border
# Visible=keyboard         ; keyboard | always: the ring on a pointer-focused control too
#
# [Selection]
# Mode=tonal               ; tonal | solid
# Boundary=true            ; a selected control draws a primary-colour boundary
#
# [Motion]
# Enabled=true             ; colour-only transitions, none on press or disabled
# Duration=80              ; milliseconds, 0..1000
#
# --- Emphasis: how a family of controls rests (hover, pressed, checked, disabled keep their rules) ---
# [Emphasis]
# Button=outline           ; outline | flat | solid | default   (default: leave the template's choice)
# Input=default
# Tab=default
# Row=default
# MenuItem=default
#
# --- Per element: any id of data/element-hooks.yaml; an unknown id or key is reported, never ignored ---
# [Element.button]
# Fill=primary             ; a role name (with or without @), transparent, or #rrggbb[aa]
# Text=primary_text
# Border=none
# Radius=3                 ; px, 0..64
# BorderWidth=1            ; px, 0..8
# PaddingX=12              ; px, 0..64
# PaddingY=4
# MinHeight=32             ; px, 0..256
# Emphasis=default
